name: HAX ROYALE Android APK
on:
  push:
    branches: [hax-royale-native]
    paths:
      - 'source64/**'
      - '.github/workflows/hax-royale-android.yml'
      - 'HAX_ROYALE_NATIVE/assets/icon.svg'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and extract native Godot project
        shell: bash
        run: |
          cat source64/*.part > /tmp/hax-source.b64
          test "$(wc -c < /tmp/hax-source.b64)" -eq 20420
          base64 --decode /tmp/hax-source.b64 > /tmp/hax-source.tar.gz
          test "$(stat -c%s /tmp/hax-source.tar.gz)" -eq 15315
          tar -tzf /tmp/hax-source.tar.gz
          tar -xzf /tmp/hax-source.tar.gz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android SDK and debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Apply Godot 4 compatibility fixes and mobile texture settings
        working-directory: HAX_ROYALE_NATIVE
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path("scripts/game.gd")
          source = script.read_text()
          replacements = {
              "var crown_mesh := ConeMesh.new(); crown_mesh.top_radius = 0.05; crown_mesh.bottom_radius = 2.25; crown_mesh.height = 5.4; crown_mesh.radial_segments = 7":
              "var crown_mesh := CylinderMesh.new(); crown_mesh.top_radius = 0.05; crown_mesh.bottom_radius = 2.25; crown_mesh.height = 5.4; crown_mesh.radial_segments = 7",
              'var kind := ["ammo","armor","med","weapon"][rng.randi_range(0,3)]':
              'var kind: String = ["ammo","armor","med","weapon"][rng.randi_range(0,3)]',
              'var headshot := hit_pos.y > (b["node"].global_position.y+1.73)':
              'var headshot: bool = hit_pos.y > (b["node"].global_position.y+1.73)',
              'var needed := int(w["mag"])-magazine[weapon_index]':
              'var needed: int = int(w["mag"])-magazine[weapon_index]',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit("Expected compatibility pattern not found: " + old)
              source = source.replace(old, new, 1)
          script.write_text(source)
          project = Path("project.godot")
          settings = project.read_text()
          needle = "lights_and_shadows/use_physical_light_units=false"
          if needle not in settings:
              raise SystemExit("Could not locate rendering settings")
          settings = settings.replace(needle, needle + "\ntextures/vram_compression/import_etc2_astc=true", 1)
          project.write_text(settings)
          PY
      - name: Import and validate Godot project
        working-directory: HAX_ROYALE_NATIVE
        shell: bash
        run: |
          test -f assets/icon.svg
          godot --version
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -Eq "SCRIPT ERROR|Parse Error|ERROR:" /tmp/godot-import.log; then exit 1; fi
          godot --headless --path . --quit-after 3 2>&1 | tee /tmp/godot-run.log
          if grep -Eq "SCRIPT ERROR|Parse Error|ERROR:" /tmp/godot-run.log; then exit 1; fi
      - name: Export APK, enforce size limit and verify signature
        working-directory: HAX_ROYALE_NATIVE
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/HAX_ROYALE_REBUILT.apk
          test -s build/HAX_ROYALE_REBUILT.apk
          APK_SIZE=$(stat -c%s build/HAX_ROYALE_REBUILT.apk)
          echo "APK_SIZE_BYTES=$APK_SIZE"
          test "$APK_SIZE" -le 188743680
          unzip -t build/HAX_ROYALE_REBUILT.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose build/HAX_ROYALE_REBUILT.apk
          sha256sum build/HAX_ROYALE_REBUILT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HAX-ROYALE-ANDROID-APK
          path: HAX_ROYALE_NATIVE/build/HAX_ROYALE_REBUILT.apk
          if-no-files-found: error
          retention-days: 30
